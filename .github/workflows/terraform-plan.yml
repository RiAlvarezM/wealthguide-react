name: terraform-plan

on:
  pull_request:
    branches: [develop]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            environment: development
            working_directory: terraform/envs/dev/app
          - name: prod
            environment: production
            working_directory: terraform/envs/prod/app
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - run: terraform fmt -check

      - run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate" \
            -backend-config="prefix=app"

      - run: terraform validate

      - id: plan
        run: terraform plan -no-color -input=false -out=plan.bin
        continue-on-error: true

      - run: terraform show -no-color plan.bin > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join('${{ matrix.working_directory }}', 'plan.txt');
            let plan = fs.readFileSync(planPath, 'utf8');
            const maxLen = 60000;
            if (plan.length > maxLen) {
              plan = plan.slice(0, maxLen) + '\n\n... (plan truncado, revisa el log completo del job para el detalle)';
            }
            const outcome = '${{ steps.plan.outcome }}';
            const body = [
              `#### Terraform Plan — \`${{ matrix.name }}\` (${outcome})`,
              '<details><summary>Ver plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
